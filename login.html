<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>เข้าสู่ระบบ | เลิศรสโรตี</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#8b0000">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<script>
if("serviceWorker" in navigator){
  navigator.serviceWorker.register("service-worker.js");
}
</script>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">

<div class="bg-white p-6 rounded-xl shadow-lg w-full max-w-sm">
  <h2 class="text-xl font-bold text-center mb-4">สมัครสมาชิก</h2>

  <input id="user" placeholder="ชื่อผู้ใช้"
    class="w-full border p-2 rounded mb-2">

  <input id="pass" type="password" placeholder="รหัสผ่าน"
    class="w-full border p-2 rounded mb-4">

  <button onclick="register()"
    class="w-full bg-red-600 text-white py-2 rounded-lg mb-2">
    สมัครสมาชิก
  </button>

  <button onclick="login()"
    class="w-full border py-2 rounded-lg">
    เข้าสู่ระบบ
  </button>
</div>
<script src="script.js"></script>
</body>
</html>
