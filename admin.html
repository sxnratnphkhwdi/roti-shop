<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="UTF-8">
  <title>แอดมิน | เลิศรสโรตี</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#8b0000">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <header class="bg-red-600 text-white py-4 shadow-lg">
  <div class="max-w-5xl mx-auto flex justify-between items-center px-4">
    <h1 class="text-2xl font-bold">
      เลิศรสโรตี – ระบบแอดมิน
    </h1>
    <button onclick="logout()"
      class="bg-white text-red-600 px-4 py-2 rounded-lg text-sm font-semibold">
      ออกจากระบบ
    </button>
  </div>
</header>

</head>
<script> if ("serviceWorker" in navigator) { navigator.serviceWorker.register("service-worker.js"); } </script>

<body onload="checkAdmin(); showAdminTab('doing'); loadOrders(); startAdminWatcher();"> <!-- ⭐⭐ ต้องมี loadOrders() -->
  <div class="max-w-5xl mx-auto mt-6 px-4">

  <h2 class="text-xl font-bold mb-4 text-gray-800">
    📋 จัดการคำสั่งซื้อ
  </h2>

  <div class="flex gap-2 mb-4">
    <button id="tabDoing"
      onclick="showAdminTab('doing')"
      class="flex-1 py-2 rounded-lg bg-orange-500 text-white font-semibold">
      ⏳ กำลังทำ
    </button>

    <button id="tabDone"
      onclick="showAdminTab('done')"
      class="flex-1 py-2 rounded-lg bg-green-600 text-white font-semibold">
      ✅ เสร็จแล้ว
    </button>
  </div>

  <div id="adminDoing" class="space-y-4"></div>
  <div id="adminDone" class="space-y-4 hidden"></div>

  </div>

  <script src="script.js"></script>
</body>

</html>
