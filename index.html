<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>เลิศรสโรตี</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#8b0000">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<header class="bg-red-700 text-white p-4 shadow-md sticky top-0 z-50">
  <div class="max-w-5xl mx-auto flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">
    <h1 class="text-2xl font-bold text-center sm:text-left">
      🍌 เลิศรสโรตี
    </h1>

    <nav class="flex justify-center gap-2 flex-wrap">
      <button onclick="showPage('menu')" class="btn">เมนู</button>
      <button onclick="showPage('cart')" class="btn">ตะกร้า</button>
      <button onclick="showPage('orders')" class="btn">คำสั่งซื้อ</button>
      <button onclick="logout()" class="btn">ออกจากระบบ</button>
    </nav>
  </div>
</header>

</head>
<script>
if("serviceWorker" in navigator){
  navigator.serviceWorker.register("service-worker.js");
}
</script>
<body onload="checkCustomer();">
<div class="container">

<!-- เมนู -->
<div id="menu" class="max-w-5xl mx-auto p-4">
  <h2 class="text-xl font-bold mb-4">🍽 เมนูโรตี</h2>

  <div id="menuList" class="grid grid-cols-2 md:grid-cols-3 gap-4"></div>
</div>

<!-- ตะกร้า -->
<section id="cart" class="hidden p-4 max-w-3xl mx-auto">
  <h2 class="text-xl font-bold mb-4">🛒 ตะกร้าของคุณ</h2>

  <div id="cartList" class="space-y-3"></div>

  <div id="total"
    class="text-lg font-bold text-right mt-4 text-red-600">
  </div>

  <button onclick="checkout()"
    class="mt-4 w-full bg-red-600 text-white py-3 rounded-xl text-lg hover:bg-red-700">
    สั่งซื้อ
  </button>
</section>



<!-- ชำระเงิน -->
<div id="payment" class="hidden">
<h2>ชำระเงิน</h2>
<p>สแกน QR เพื่อชำระเงิน</p>
<img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=PromptPay123456">
<button onclick="confirmPayment()">ยืนยันชำระเงิน</button>
</div>

<!-- คำสั่งซื้อ -->
<div id="orders" class="hidden">
<h2>รายการคำสั่งซื้อ</h2>
<div id="orderList"></div>
</div>

</div>

<footer class="bg-gray-100 text-center text-sm text-gray-600 p-4 mt-10">
  📍 91 ถนนสีหราชเดโชชัย ตำบลทะเลชุบศร อำเภอเมือง ลพบุรี  
  <br>
  ☎️ โทร 062-248-7887
</footer>


<script src="script.js"></script>
</body>
</html>
