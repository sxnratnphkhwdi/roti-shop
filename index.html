<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>เลิศรสโรตี</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#8b0000">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<header class="bg-red-700 text-white p-4 shadow-md sticky top-0 z-50">
  <div class="max-w-5xl mx-auto flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">
    <h1 class="text-2xl font-bold text-center sm:text-left">
      เลิศรสโรตี
    </h1>

    <nav class="flex justify-center gap-2 flex-wrap">
      <button onclick="showPage('menu')" class="btn">เมนู</button>
      <button onclick="showPage('cart')" class="btn">ตะกร้า</button>
      <button onclick="showPage('orders')" class="btn">คำสั่งซื้อ</button>
      <button onclick="logout()" class="btn">ออกจากระบบ</button>
    </nav>
  </div>
</header>

</head>
<script>
if("serviceWorker" in navigator){
  navigator.serviceWorker.register("service-worker.js");
}
</script>
<body onload="checkCustomer();">
<div class="container">

<!-- เมนู -->
<div id="menu" class="max-w-5xl mx-auto p-4">
  <h2 class="text-xl font-bold mb-4">🍽 เมนูโรตี</h2>

  <div id="menuList" class="grid grid-cols-2 md:grid-cols-3 gap-4"></div>
</div>

<!-- ตะกร้า -->
<section id="cart" class="hidden p-4 max-w-3xl mx-auto">
  <h2 class="text-xl font-bold mb-4">🛒 ตะกร้าของคุณ</h2>

  <div id="cartList" class="space-y-3"></div>

  <div id="total"
    class="text-lg font-bold text-right mt-4 text-red-600">
  </div>

  <button onclick="checkout()"
    class="mt-4 w-full bg-red-600 text-white py-3 rounded-xl text-lg hover:bg-red-700">
    สั่งซื้อ
  </button>
</section>



<!-- ชำระเงิน -->
<section id="payment" class="hidden max-w-md mx-auto mt-6 px-4">
  <div class="bg-white rounded-2xl shadow-lg p-6 text-center space-y-4">

    <h2 class="text-2xl font-bold text-red-600">
      ชำระเงิน
    </h2>

    <p class="text-gray-600 text-sm">
      กรุณาสแกน QR เพื่อชำระเงิน
    </p>

    <!-- QR -->
    <div class="flex justify-center">
      <img src="qr.png" alt="QR Payment"
        class="w-48 h-48 rounded-xl border shadow">
    </div>

    <!-- ยอดเงิน -->
    <div class="bg-gray-100 rounded-lg p-3">
      <p class="text-gray-700">ยอดที่ต้องชำระ</p>
      <p id="paymentTotal"
        class="text-2xl font-bold text-green-600">
        0 บาท
      </p>
    </div>

    <!-- ปุ่มยืนยัน -->
    <button
      onclick="confirmPayment()"
      class="w-full bg-red-600 text-white py-3 rounded-xl font-semibold
             hover:bg-red-700 transition">
      ยืนยันการชำระเงิน
    </button>

    <button
      onclick="showPage('cart')"
      class="text-sm text-gray-500 hover:underline">
      ← กลับไปแก้ไขตะกร้า
    </button>

  </div>
</section>


<!-- คำสั่งซื้อ -->
<section id="orders" class="hidden max-w-5xl mx-auto p-4">

  <h2 class="text-2xl font-bold mb-4 text-red-600">
    🧾 คำสั่งซื้อของคุณ
  </h2>

  <!-- Tabs -->
  <div class="flex gap-2 mb-4">
    <button
      onclick="showOrderTab('active')"
      id="tabActive"
      class="flex-1 py-2 rounded-xl bg-red-600 text-white font-semibold">
      📦 คำสั่งซื้อ
    </button>

    <button
      onclick="showOrderTab('cancel')"
      id="tabCancel"
      class="flex-1 py-2 rounded-xl bg-gray-200 text-gray-700 font-semibold">
      ❌ ยกเลิก
    </button>
  </div>

  <!-- Order lists -->
  <div id="orderActive" class="space-y-4"></div>
  <div id="orderCancel" class="space-y-4 hidden"></div>

</section>



</div>

<footer class="bg-gray-100 text-center text-sm text-gray-600 p-4 mt-10">
  📍 91 ถนนสีหราชเดโชชัย ตำบลทะเลชุบศร อำเภอเมือง ลพบุรี  
  <br>
  ☎️ โทร 062-248-7887
</footer>


<script src="script.js"></script>
</body>
</html>
